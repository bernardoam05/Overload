name: Check (temporário)

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - name: Gerar código, analisar e testar
        run: |
          set +e
          mkdir -p ci-report
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs > ci-report/build.txt 2>&1 || true
          dart format lib test > ci-report/format.txt 2>&1 || true
          flutter analyze > ci-report/analyze.txt 2>&1; echo "exit=$?" >> ci-report/analyze.txt
          flutter test -r expanded > ci-report/test.txt 2>&1; echo "exit=$?" >> ci-report/test.txt
          tail -c 60000 ci-report/test.txt > ci-report/test-tail.txt
          rm ci-report/test.txt
      - name: Publicar resultado
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A lib test ci-report
          git commit -m "CI: código gerado e relatório ($GITHUB_SHA)" || exit 0
          git push
